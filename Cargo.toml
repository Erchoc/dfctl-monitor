[package]
name = "df"
version = "0.1.0"
edition = "2021"
description = "df CLI - application metrics monitor in your terminal"
authors = ["DNF"]

[[bin]]
name = "df"
path = "src/main.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
humantime = "2"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rand = "0.8"
rand_chacha = "0.3"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
dirs = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
